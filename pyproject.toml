[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m7_risk_rock"
version = "0.1.0"
description = "Himalayan Rock Mass Risk Engine"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pymc"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
